name: Flutter Release Workflow

on:
  workflow_call:
    inputs:
      app_directory:
        required: true
        type: string
        description: "Name of the app directory (e.g., hisnelmoslem, alazkar, qadaa)"
      package_name:
        required: true
        type: string
        description: "Android package name (e.g., com.hassaneltantawy.hisnelmoslem)"
      java_version:
        required: false
        type: string
        default: "18"
        description: "Java version to use"
      app_display_name:
        required: false
        type: string
        default: ""
        description: "Name shown in the Windows installer and Start menu (defaults to app_directory)"
      app_publisher:
        required: false
        type: string
        default: ""
        description: "Publisher shown in the Windows installer (defaults to the repository owner)"
    secrets:
      KEY_PROPERTIES:
        required: true
      KEYSTORE_BASE64:
        required: true
      SERVICE_ACCOUNT_JSON:
        required: true

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app_directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: ${{ inputs.java_version }}

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', inputs.app_directory)) }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Android Signing
        run: |
          echo "storeFile=keystore.jks" > android/key.properties
          echo "${{ secrets.KEY_PROPERTIES }}" >> android/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build universal APK
        run: flutter build apk --flavor prod --release

      - name: Rename universal APK
        run: |
          APP="${{ inputs.app_directory }}"
          src="build/app/outputs/flutter-apk/app-prod-release.apk"
          if [ ! -f "$src" ]; then
            src=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name "*.apk" ! -name "*arm*" ! -name "*x86*" ! -name "*.sha1" 2>/dev/null | head -n 1)
          fi
          if [ -n "$src" ] && [ -f "$src" ]; then
            mv "$src" "${APP}-android.apk"
            echo "✅ Moved $src -> ${APP}-android.apk"
          else
            echo "::error::Universal APK was not found"
            exit 1
          fi

      - name: Build split-per-abi APKs
        run: flutter build apk --flavor prod --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --flavor prod --release

      - name: Rename artifacts
        run: |
          echo "📂 Build outputs:"
          ls -la build/app/outputs/flutter-apk/ build/app/outputs/bundle/prodRelease/

          APP="${{ inputs.app_directory }}"
          found=0
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -iname "*${abi}*release.apk" ! -name "*.sha1" 2>/dev/null | head -n 1)

            if [ -n "$src" ] && [ -f "$src" ]; then
              mv "$src" "${APP}-android-${abi}.apk"
              echo "✅ Moved $src -> ${APP}-android-${abi}.apk"
              found=$((found + 1))
            else
              echo "::warning::Split APK for ${abi} was not produced (searched build/app/outputs/flutter-apk for *${abi}*release.apk)"
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No split-per-abi APKs were produced"
            exit 1
          fi

          aab_src="build/app/outputs/bundle/prodRelease/app-prod-release.aab"
          if [ ! -f "$aab_src" ]; then
            aab_src=$(find build/app/outputs/bundle -type f -name "*.aab" 2>/dev/null | head -n 1)
          fi
          if [ -n "$aab_src" ] && [ -f "$aab_src" ]; then
            mv "$aab_src" "${APP}-android.aab"
            echo "✅ Moved $aab_src -> ${APP}-android.aab"
          else
            echo "::error::App bundle (.aab) was not found"
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android.apk
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android-armeabi-v7a.apk
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android-arm64-v8a.apk
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android-x86_64.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android.aab

      - name: Zip debug symbols (if available)
        run: |
          DIR="build/app/intermediates/merged_native_libs/prodRelease/mergeProdReleaseNativeLibs/out/lib/"
          OUT_ZIP="build/app/debug_symbols.zip"

          if [ -d "$DIR" ]; then
            echo "🧩 Found native libs in: $DIR"
            OUT_ZIP_ABS="$(pwd)/$OUT_ZIP"
            cd "$DIR"
            zip -r "$OUT_ZIP_ABS" .
            cd -
            echo "✅ Debug symbols zipped successfully: $OUT_ZIP_ABS"
          else
            echo "⚠️ No native debug symbols directory found at: $DIR"
            mkdir -p "$(dirname $OUT_ZIP)"
            touch "$OUT_ZIP"
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android.aab
          track: production
          mappingFile: ${{ inputs.app_directory }}/build/app/outputs/mapping/prodRelease/mapping.txt
          debugSymbols: ${{ inputs.app_directory }}/build/app/debug_symbols.zip
          whatsNewDirectory: distribution/whatsnew

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ inputs.app_directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        shell: pwsh
        run: echo "version=$(Get-Content -Path .fvmrc | ConvertFrom-Json | Select-Object -ExpandProperty flutter)" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Get dependencies
        run: flutter pub get


      - name: Clean previous build artifacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force windows/flutter/ephemeral -ErrorAction SilentlyContinue

      - name: Build Windows
        run: flutter build windows

      - name: Package Windows build
        shell: pwsh
        run: |
          $zipName = "${{ inputs.app_directory }}-windows.zip"

          New-Item -ItemType Directory -Force -Path "${{ inputs.app_directory }}"
          Copy-Item -Recurse build/windows/x64/runner/Release/* "${{ inputs.app_directory }}/"
          Compress-Archive -Path "${{ inputs.app_directory }}" -DestinationPath $zipName -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          function Find-Iscc {
            $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
            foreach ($root in $roots) {
              $found = Get-ChildItem -Path $root -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue |
                ForEach-Object { Join-Path $_.FullName "ISCC.exe" } |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1
              if ($found) { return $found }
            }
            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup (exit code $LASTEXITCODE)" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }

          Write-Host "Using $iscc"
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Build Windows installer
        shell: pwsh
        env:
          APP_DIR: ${{ inputs.app_directory }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          APP_DISPLAY_NAME: ${{ inputs.app_display_name }}
          APP_PUBLISHER: ${{ inputs.app_publisher }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = "Stop"

          $displayName = if ($env:APP_DISPLAY_NAME) { $env:APP_DISPLAY_NAME } else { $env:APP_DIR }
          $publisher = if ($env:APP_PUBLISHER) { $env:APP_PUBLISHER } else { $env:REPO_OWNER }

          # Version: pubspec "version: 1.2.3+4" -> "1.2.3"
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*(\d+(?:\.\d+)*)') {
            throw "Could not read version from pubspec.yaml"
          }
          $version = $Matches[1]

          # Executable name: BINARY_NAME in windows/CMakeLists.txt (falls back to the app directory name)
          $appExe = "$($env:APP_DIR).exe"
          if ((Get-Content windows/CMakeLists.txt -Raw) -match '(?m)^\s*set\(BINARY_NAME\s+"([^"]+)"\)') {
            $appExe = "$($Matches[1]).exe"
          }

          $sourceDir = (Resolve-Path build/windows/x64/runner/Release).Path
          if (-not (Test-Path (Join-Path $sourceDir $appExe))) {
            throw "Expected executable '$appExe' not found in $sourceDir"
          }

          # Stable AppId per package so upgrades replace the previous install
          $md5 = [System.Security.Cryptography.MD5]::Create()
          $hash = $md5.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($env:PACKAGE_NAME))
          $appId = "{{" + ([guid]::new([byte[]]$hash)).ToString().ToUpper() + "}"

          $iconPath = Join-Path (Get-Location).Path "windows/runner/resources/app_icon.ico"
          $iconLine = if (Test-Path $iconPath) { "SetupIconFile=$iconPath" } else { "" }

          $outputDir = (Get-Location).Path
          $outputName = "$($env:APP_DIR)-windows-installer"

          $template = @'
          [Setup]
          AppId=@@APP_ID@@
          AppName=@@APP_NAME@@
          AppVersion=@@APP_VERSION@@
          AppPublisher=@@APP_PUBLISHER@@
          DefaultDirName={autopf}\@@APP_NAME@@
          DisableProgramGroupPage=yes
          OutputDir=@@OUTPUT_DIR@@
          OutputBaseFilename=@@OUTPUT_NAME@@
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          UninstallDisplayIcon={app}\@@APP_EXE@@
          @@ICON_LINE@@

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "@@SOURCE_DIR@@\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\@@APP_NAME@@"; Filename: "{app}\@@APP_EXE@@"
          Name: "{autodesktop}\@@APP_NAME@@"; Filename: "{app}\@@APP_EXE@@"; Tasks: desktopicon

          [Run]
          Filename: "{app}\@@APP_EXE@@"; Description: "{cm:LaunchProgram,@@APP_NAME@@}"; Flags: nowait postinstall skipifsilent
          '@

          $script = $template
          $script = $script.Replace("@@APP_ID@@", $appId)
          $script = $script.Replace("@@APP_NAME@@", $displayName)
          $script = $script.Replace("@@APP_VERSION@@", $version)
          $script = $script.Replace("@@APP_PUBLISHER@@", $publisher)
          $script = $script.Replace("@@OUTPUT_DIR@@", $outputDir)
          $script = $script.Replace("@@OUTPUT_NAME@@", $outputName)
          $script = $script.Replace("@@APP_EXE@@", $appExe)
          $script = $script.Replace("@@SOURCE_DIR@@", $sourceDir)
          $script = $script.Replace("@@ICON_LINE@@", $iconLine)

          $issPath = Join-Path $env:RUNNER_TEMP "installer.iss"
          Set-Content -Path $issPath -Value $script -Encoding utf8BOM
          Write-Host "Generated Inno Setup script:"
          Get-Content $issPath

          & $env:ISCC_PATH $issPath
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          $installer = Join-Path $outputDir "$outputName.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }

          "APP_EXE=$appExe" >> $env:GITHUB_ENV
          "INSTALLER_PATH=$installer" >> $env:GITHUB_ENV

      - name: Test Windows installer (silent install and uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $env:RUNNER_TEMP "installer-test"
          $log = Join-Path $env:RUNNER_TEMP "installer-test.log"

          $install = Start-Process -FilePath $env:INSTALLER_PATH -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER",
            "/DIR=`"$installDir`"", "/LOG=`"$log`""
          )
          if ($install.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Installer exited with code $($install.ExitCode)"
          }

          if (-not (Test-Path (Join-Path $installDir $env:APP_EXE))) {
            if (Test-Path $log) { Get-Content $log }
            throw "$env:APP_EXE was not installed to $installDir"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found at $uninstaller" }
          $uninstall = Start-Process -FilePath $uninstaller -Wait -PassThru -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }

          Write-Host "Installer smoke test passed"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-windows.zip
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-windows-installer.exe

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_android
      - build_windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: .

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: .

      - name: Generate release body
        run: |
          APP="${{ inputs.app_directory }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          PLAY_URL="https://play.google.com/store/apps/details?id=${{ inputs.package_name }}"

          # Only link to artifacts that were actually built
          link() {
            if [ -f "$1" ]; then
              echo "[$2](${BASE_URL}/$1)"
            else
              echo "—"
            fi
          }

          APK_UNIVERSAL="$(link "${APP}-android.apk" APK)"
          APK_X86_64="$(link "${APP}-android-x86_64.apk" APK)"
          APK_ARM64="$(link "${APP}-android-arm64-v8a.apk" APK)"
          APK_ARMV7="$(link "${APP}-android-armeabi-v7a.apk" APK)"
          WIN_INSTALLER="$(link "${APP}-windows-installer.exe" Installer)"
          WIN_ZIP="$(link "${APP}-windows.zip" ZIP)"

          cat > release_body.md << EOF
          ## Downloads

          | Architecture | Windows | Android |
          |---|---|---|
          | Universal | — | ${APK_UNIVERSAL} |
          | x86-64 (64-bit) | ${WIN_INSTALLER} · ${WIN_ZIP} | ${APK_X86_64} |
          | AArch64 (ARM64) | — | ${APK_ARM64} |
          | ARMv7 (32-bit) | — | ${APK_ARMV7} |

          📱 Also available on [Google Play](${PLAY_URL})

          ---

          EOF

          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.md >> release_body.md
          else
            echo "::warning::CHANGELOG.md not found, release body will not include a changelog"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          generate_release_notes: true
          files: |
            ${{ inputs.app_directory }}-android.apk
            ${{ inputs.app_directory }}-android-armeabi-v7a.apk
            ${{ inputs.app_directory }}-android-arm64-v8a.apk
            ${{ inputs.app_directory }}-android-x86_64.apk
            ${{ inputs.app_directory }}-windows.zip
            ${{ inputs.app_directory }}-windows-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}