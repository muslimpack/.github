name: Flutter Release Workflow

on:
  workflow_call:
    inputs:
      app_directory:
        required: true
        type: string
        description: "Name of the app directory (e.g., hisnelmoslem, alazkar, qadaa)"
      package_name:
        required: true
        type: string
        description: "Android package name (e.g., com.hassaneltantawy.hisnelmoslem)"
      app_display_name:
        required: false
        type: string
        description: "Human-readable app name shown in the installer (defaults to app_directory)"
      # Fix 1: flavor is now an input instead of being hardcoded to "prod"
      flavor:
        required: false
        type: string
        default: "prod"
        description: "Flutter build flavor (e.g., prod, production, dev)"
      # Fix 5: changed default from 18 (EOL) to 17 (LTS)
      java_version:
        required: false
        type: string
        default: "17"
        description: "Java version to use (default: 17 LTS)"
    secrets:
      KEY_PROPERTIES:
        required: true
      KEYSTORE_BASE64:
        required: true
      SERVICE_ACCOUNT_JSON:
        required: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Validate release metadata early
  # Blocks all builds immediately if whatsnew
  # files exceed Google Play's 500-char limit.
  # ─────────────────────────────────────────────
  validate:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whatsnew character limits
        run: |
          failed=0
          for f in distribution/whatsnew/*; do
            [ -e "$f" ] || { echo "⚠️ No whatsnew files found in distribution/whatsnew/"; break; }
            len=$(wc -m < "$f")
            if [ "$len" -gt 500 ]; then
              echo "❌ $f exceeds 500 chars ($len/500)"
              failed=1
            else
              echo "✅ $f is OK ($len/500 chars)"
            fi
          done
          [ $failed -eq 0 ] || exit 1

  # ─────────────────────────────────────────────
  # Job 2: Build Android
  # ─────────────────────────────────────────────
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.app_directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ inputs.java_version }}

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', inputs.app_directory)) }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/android/**/*.gradle*', inputs.app_directory), format('{0}/android/gradle/wrapper/gradle-wrapper.properties', inputs.app_directory)) }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      # Fix 3: KEY_PROPERTIES secret now contains the FULL key.properties content.
      # No longer prepending "storeFile=keystore.jks" — that line must be included
      # in the secret itself to avoid silently overwriting any extra config.
      - name: Setup Android Signing
        run: |
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      # Fix 1: --flavor now uses the input variable instead of hardcoded "prod"
      - name: Build APK
        run: flutter build apk --flavor ${{ inputs.flavor }} --release

      - name: Build App Bundle
        run: flutter build appbundle --flavor ${{ inputs.flavor }} --release

      # Fix 1: artifact paths now derived from the flavor input
      - name: Rename artifacts
        run: |
          version=${GITHUB_REF_NAME#v}
          flavor="${{ inputs.flavor }}"
          # Capitalize first letter for bundle path (e.g. prod -> Prod)
          flavor_cap="$(echo ${flavor:0:1} | tr '[:lower:]' '[:upper:]')${flavor:1}"

          echo "VERSION_TAG=$version" >> $GITHUB_ENV
          echo "FLAVOR_CAP=$flavor_cap" >> $GITHUB_ENV

          mv build/app/outputs/flutter-apk/app-${flavor}-release.apk \
            ${{ inputs.app_directory }}_${version}_android.apk
          mv build/app/outputs/bundle/${flavor}Release/app-${flavor}-release.aab \
            ${{ inputs.app_directory }}_${version}_android.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ${{ inputs.app_directory }}/${{ inputs.app_directory }}_${{ env.VERSION_TAG }}_android.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: ${{ inputs.app_directory }}/${{ inputs.app_directory }}_${{ env.VERSION_TAG }}_android.aab

      # Fix 2: native lib path now derived from flavor input.
      # Added find-based fallback to guard against AGP internal path changes.
      - name: Zip debug symbols (if available)
        run: |
          flavor="${{ inputs.flavor }}"
          flavor_cap="${{ env.FLAVOR_CAP }}"
          DIR="build/app/intermediates/merged_native_libs/${flavor}Release/merge${flavor_cap}ReleaseNativeLibs/out/lib/"
          OUT_ZIP="build/app/debug_symbols.zip"

          # Fallback: search for lib dir if primary path doesn't exist
          if [ ! -d "$DIR" ]; then
            echo "⚠️ Primary path not found, searching for native libs..."
            FOUND=$(find build/app/intermediates/merged_native_libs -type d -name "lib" 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              DIR="$FOUND"
              echo "🔍 Found native libs at: $DIR"
            fi
          fi

          if [ -d "$DIR" ]; then
            echo "🧩 Zipping native libs from: $DIR"
            OUT_ZIP_ABS="$(pwd)/$OUT_ZIP"
            cd "$DIR"
            zip -r "$OUT_ZIP_ABS" .
            cd -
            echo "✅ Debug symbols zipped successfully"
          else
            echo "⚠️ No native debug symbols found, uploading empty placeholder"
            mkdir -p "$(dirname $OUT_ZIP)"
            touch "$OUT_ZIP"
          fi

      # Fix 1: mapping path derived from flavor input
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ inputs.app_directory }}/${{ inputs.app_directory }}_${{ env.VERSION_TAG }}_android.aab
          track: production
          mappingFile: ${{ inputs.app_directory }}/build/app/outputs/mapping/${{ inputs.flavor }}Release/mapping.txt
          debugSymbols: ${{ inputs.app_directory }}/build/app/debug_symbols.zip
          whatsNewDirectory: distribution/whatsnew

  # ─────────────────────────────────────────────
  # Job 3: Build Windows
  # Produces both a portable .zip and an
  # Inno Setup installer .exe
  # ─────────────────────────────────────────────
  build_windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.app_directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        shell: pwsh
        run: echo "version=$(Get-Content -Path .fvmrc | ConvertFrom-Json | Select-Object -ExpandProperty flutter)" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', inputs.app_directory)) }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Resolve app display name and exe name
        id: naming
        shell: pwsh
        run: |
          $displayName = "${{ inputs.app_display_name }}"
          if ([string]::IsNullOrWhiteSpace($displayName)) {
            $displayName = "${{ inputs.app_directory }}"
          }
          echo "display_name=$displayName" >> $env:GITHUB_OUTPUT
          echo "exe_name=${{ inputs.app_directory }}.exe" >> $env:GITHUB_OUTPUT

      # ── Portable zip ────────────────────────────
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $zipName = "${{ inputs.app_directory }}_${version}_windows.zip"
          $buildOutput = "build/windows/x64/runner/Release"

          New-Item -ItemType Directory -Force -Path "portable_staging"
          Copy-Item -Recurse "$buildOutput\*" "portable_staging/"
          Compress-Archive -Path "portable_staging" -DestinationPath $zipName

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ inputs.app_directory }}/${{ env.ZIP_NAME }}

      # ── Inno Setup installer ─────────────────────
      - name: Copy Inno Setup script
        shell: pwsh
        run: Copy-Item -Path "../installer.iss" -Destination "installer.iss"

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: ${{ inputs.app_directory }}/installer.iss
          options: >-
            /DAppName="${{ steps.naming.outputs.display_name }}"
            /DAppVersion="${{ github.ref_name }}"
            /DAppExeName="${{ steps.naming.outputs.exe_name }}"
            /DSourceDir="build/windows/x64/runner/Release"
            /DOutputDir="installer_output"

      - name: Rename installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $installerName = "${{ inputs.app_directory }}_${version}_windows_setup.exe"
          $srcPath = "installer_output/${{ steps.naming.outputs.display_name }}_${{ github.ref_name }}_windows_setup.exe"
          Move-Item -Path $srcPath -Destination $installerName
          echo "INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ inputs.app_directory }}/${{ env.INSTALLER_NAME }}

  # ─────────────────────────────────────────────
  # Job 4: Create GitHub Release
  # Runs only after both builds succeed.
  # ─────────────────────────────────────────────
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_android, build_windows]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: .

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: .

      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: .

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: .

      - name: Extract version tag
        run: echo "VERSION_TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            ${{ inputs.app_directory }}_${{ env.VERSION_TAG }}_android.apk
            ${{ inputs.app_directory }}_${{ env.VERSION_TAG }}_android.aab
            ${{ inputs.app_directory }}_${{ env.VERSION_TAG }}_windows.zip
            ${{ inputs.app_directory }}_${{ env.VERSION_TAG }}_windows_setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
