name: Flutter Release Workflow

on:
  workflow_call:
    inputs:
      app_directory:
        required: true
        type: string
        description: "Name of the app directory (e.g., hisnelmoslem, alazkar, qadaa)"
      package_name:
        required: true
        type: string
        description: "Android package name (e.g., com.hassaneltantawy.hisnelmoslem)"
      java_version:
        required: false
        type: string
        default: "18"
        description: "Java version to use"
    secrets:
      KEY_PROPERTIES:
        required: true
      KEYSTORE_BASE64:
        required: true
      SERVICE_ACCOUNT_JSON:
        required: true

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app_directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ inputs.java_version }}

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', inputs.app_directory)) }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Android Signing
        run: |
          echo "storeFile=keystore.jks" > android/key.properties
          echo "${{ secrets.KEY_PROPERTIES }}" >> android/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build universal APK
        run: flutter build apk --flavor prod --release

      - name: Rename universal APK
        run: mv build/app/outputs/flutter-apk/app-prod-release.apk ${{ inputs.app_directory }}-android.apk

      - name: Build split-per-abi APKs
        run: flutter build apk --flavor prod --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --flavor prod --release

      - name: Rename artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-prod-armeabi-v7a-release.apk ${{ inputs.app_directory }}-android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-prod-arm64-v8a-release.apk ${{ inputs.app_directory }}-android-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-prod-x86_64-release.apk ${{ inputs.app_directory }}-android-x86_64.apk
          mv build/app/outputs/bundle/prodRelease/app-prod-release.aab ${{ inputs.app_directory }}-android.aab

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android.apk
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android-armeabi-v7a.apk
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android-arm64-v8a.apk
            ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android-x86_64.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android.aab

      - name: Zip debug symbols (if available)
        run: |
          DIR="build/app/intermediates/merged_native_libs/prodRelease/mergeProdReleaseNativeLibs/out/lib/"
          OUT_ZIP="build/app/debug_symbols.zip"

          if [ -d "$DIR" ]; then
            echo "🧩 Found native libs in: $DIR"
            OUT_ZIP_ABS="$(pwd)/$OUT_ZIP"
            cd "$DIR"
            zip -r "$OUT_ZIP_ABS" .
            cd -
            echo "✅ Debug symbols zipped successfully: $OUT_ZIP_ABS"
          else
            echo "⚠️ No native debug symbols directory found at: $DIR"
            mkdir -p "$(dirname $OUT_ZIP)"
            touch "$OUT_ZIP"
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ inputs.app_directory }}/${{ inputs.app_directory }}-android.aab
          track: production
          mappingFile: ${{ inputs.app_directory }}/build/app/outputs/mapping/prodRelease/mapping.txt
          debugSymbols: ${{ inputs.app_directory }}/build/app/debug_symbols.zip
          whatsNewDirectory: distribution/whatsnew

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ inputs.app_directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        shell: pwsh
        run: echo "version=$(Get-Content -Path .fvmrc | ConvertFrom-Json | Select-Object -ExpandProperty flutter)" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Get dependencies
        run: flutter pub get


      - name: Clean previous build artifacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force windows/flutter/ephemeral -ErrorAction SilentlyContinue

      - name: Build Windows
        run: flutter build windows

      - name: Package Windows build
        shell: pwsh
        run: |
          $zipName = "${{ inputs.app_directory }}-windows.zip"

          New-Item -ItemType Directory -Force -Path "${{ inputs.app_directory }}"
          Copy-Item -Recurse build/windows/x64/runner/Release/* "${{ inputs.app_directory }}/"
          Compress-Archive -Path "${{ inputs.app_directory }}" -DestinationPath $zipName -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ inputs.app_directory }}/${{ inputs.app_directory }}-windows.zip

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_android
      - build_windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: .

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: .

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: .

      - name: Generate release body
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          PLAY_URL="https://play.google.com/store/apps/details?id=${{ inputs.package_name }}"

          cat > release_body.md << EOF
          ## Downloads

          | Architecture | Windows | Android |
          |---|---|---|
          | Universal | — | [APK](${BASE_URL}/${{ inputs.app_directory }}-android.apk) |
          | x86-64 (64-bit) | [ZIP](${BASE_URL}/${{ inputs.app_directory }}-windows.zip) | [APK](${BASE_URL}/${{ inputs.app_directory }}-android-x86_64.apk) |
          | AArch64 (ARM64) | — | [APK](${BASE_URL}/${{ inputs.app_directory }}-android-arm64-v8a.apk) |
          | ARMv7 (32-bit) | — | [APK](${BASE_URL}/${{ inputs.app_directory }}-android-armeabi-v7a.apk) |

          📱 Also available on [Google Play](${PLAY_URL})

          ---

          EOF

          cat CHANGELOG.md >> release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          generate_release_notes: true
          files: |
            ${{ inputs.app_directory }}-android.apk
            ${{ inputs.app_directory }}-android-armeabi-v7a.apk
            ${{ inputs.app_directory }}-android-arm64-v8a.apk
            ${{ inputs.app_directory }}-android-x86_64.apk
            ${{ inputs.app_directory }}-android.aab
            ${{ inputs.app_directory }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}